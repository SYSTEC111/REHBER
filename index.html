<!DOCTYPE html>
<html lang="tr">

    <title>Personel İletişim Rehberi</title>
    <style>

        h1 { color: #217346; border-bottom: 2px solid #217346; padding-bottom: 10px; }
        .search-box { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background-color: #217346; color: white; text-align: left; padding: 12px; border: 1px solid #1e6b41; }
        td { padding: 12px; border: 1px solid #ddd; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #e8f5e9; }
        a { color: #0052cc; text-decoration: none; font-weight: bold; }
    </style>
</head>
